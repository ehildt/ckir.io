name: Build & Publish BullMQ Package

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com/

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Configure npm auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN_PACKAGES }}" > ~/.npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Lint code
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build library
        run: pnpm run build:lib

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN_PACKAGES }}
