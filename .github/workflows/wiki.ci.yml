name: Sync folder to Wiki
on:
  push:
    branches: [dev]
    paths:
      - '.wiki/**'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - name: Mirror .wiki -> Wiki repo
        run: |
          rsync -a --delete .wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync wiki from repo"
          git push
